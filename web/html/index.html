<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ssheasy — SSH &amp; SFTP in your browser</title>
    <style>
      :root {
        --bg: #eef0f3;
        --panel: #ffffff;
        --line: #dde1e7;
        --text: #171b21;
        --muted: #6a7484;
        --accent: #2563eb;
        --accent-soft: #e8f0fe;
        --ok: #22c55e;
        --err: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── top bar ─────────────────────────────────────────────── */
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: 6px;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        user-select: none;
      }
      .brand-mark {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        background: linear-gradient(135deg, #2563eb, #7aa7ff);
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 240px;
        padding: 6px 8px 6px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
      }
      .tab:hover { background: #f2f4f7; color: var(--text); }
      .tab.is-active {
        background: var(--panel);
        border-color: var(--line);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c3c9d2;
        transition: background 0.15s ease;
      }
      .tab.is-connected .dot { background: var(--ok); }
      .tab.is-error .dot { background: var(--err); }
      .tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab-close {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        font-size: 15px;
        line-height: 1;
        color: #98a1ae;
        opacity: 0;
      }
      .tab:hover .tab-close, .tab.is-active .tab-close { opacity: 1; }
      .tab-close:hover { background: #e5e8ec; color: var(--text); }
      .add {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      .add:hover { color: var(--accent); border-color: #c9d6f2; background: var(--accent-soft); }
      .spacer { flex: 1; }
      .tagline { font-size: 12px; color: #9aa3b0; user-select: none; }
      @media (max-width: 720px) { .tagline { display: none; } }

      /* ── session stage ───────────────────────────────────────── */
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: var(--panel);
      }
      .session-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--panel);
      }
      .session-frame[hidden] { display: none; }

      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
      }
      .empty[hidden] { display: none; }
      .empty-card {
        max-width: 380px;
        text-align: center;
      }
      .empty-card h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 640;
        letter-spacing: -0.02em;
      }
      .empty-card p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .btn-primary {
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 560;
        cursor: pointer;
      }
      .btn-primary:hover { background: #1d54d0; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>ssheasy</div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Sessions"></div>
      <button class="add" id="addTab" type="button" title="New session" aria-label="New session">+</button>
      <div class="spacer"></div>
      <span class="tagline">SSH &amp; SFTP in your browser</span>
    </header>

    <main id="stage">
      <div class="empty" id="empty" hidden>
        <div class="empty-card">
          <h1>No open sessions</h1>
          <p>Every tab is an independent SSH connection, with a terminal and a file browser of its own.</p>
          <button class="btn-primary" type="button" id="emptyNew">New session</button>
        </div>
      </div>
    </main>

    <script>
      // Each tab is a separate session.html document. The Go/wasm client keeps
      // its SSH connection, terminal and SFTP client in per-document globals,
      // so a document per tab is what makes several sessions possible at once.
      var stage = document.getElementById('stage');
      var tabsEl = document.getElementById('tabs');
      var emptyEl = document.getElementById('empty');
      var sessions = new Map();
      var activeId = null;
      var seq = 0;

      function newSession(params) {
        var id = 's' + (++seq);

        var frame = document.createElement('iframe');
        frame.className = 'session-frame';
        frame.title = 'SSH session';
        frame.src = 'session.html' + (params ? '?' + params : '');
        stage.appendChild(frame);

        var tab = document.createElement('div');
        tab.className = 'tab';
        tab.dataset.id = id;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('tabindex', '0');
        tab.innerHTML =
          '<span class="dot"></span>' +
          '<span class="tab-label"></span>' +
          '<span class="tab-close" role="button" tabindex="-1" title="Close session">&times;</span>';
        tabsEl.appendChild(tab);

        sessions.set(id, { id: id, frame: frame, tab: tab, label: 'New session' });

        tab.querySelector('.tab-label').textContent = 'New session';
        tab.addEventListener('click', function (e) {
          if (e.target.classList.contains('tab-close')) {
            closeSession(id);
            return;
          }
          activate(id);
        });
        tab.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(id); }
          if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); closeSession(id); }
        });

        activate(id);
        return id;
      }

      function activate(id) {
        if (!sessions.has(id)) return;
        activeId = id;
        sessions.forEach(function (s) {
          var on = s.id === id;
          s.frame.hidden = !on;
          s.tab.classList.toggle('is-active', on);
          s.tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        emptyEl.hidden = sessions.size > 0;
        var frame = sessions.get(id).frame;
        try { frame.focus(); } catch (e) {}
        var input = frame.contentDocument && frame.contentDocument.getElementById('hostInp');
        if (input) { try { input.focus(); } catch (e) {} }
      }

      function closeSession(id) {
        var s = sessions.get(id);
        if (!s) return;
        var ids = Array.from(sessions.keys());
        var idx = ids.indexOf(id);
        s.frame.remove();
        s.tab.remove();
        sessions.delete(id);
        if (activeId === id) {
          var next = ids[idx + 1] || ids[idx - 1];
          if (next && sessions.has(next)) activate(next);
        }
        if (sessions.size === 0) {
          activeId = null;
          emptyEl.hidden = false;
        }
      }

      function setLabel(s, label, state) {
        s.label = label;
        s.tab.querySelector('.tab-label').textContent = label;
        s.tab.title = label;
        s.tab.classList.toggle('is-connected', state === 'connected');
        s.tab.classList.toggle('is-error', state === 'error');
      }

      // Sessions report their own state so the tab can show host and status.
      window.addEventListener('message', function (e) {
        if (e.origin !== window.location.origin) return;
        var data = e.data;
        if (!data || typeof data.type !== 'string' || data.type.indexOf('ssheasy:') !== 0) return;
        var s = null;
        sessions.forEach(function (cand) { if (cand.frame.contentWindow === e.source) s = cand; });
        if (!s) return;
        if (data.type === 'ssheasy:connected') setLabel(s, data.label || 'Connected', 'connected');
        else if (data.type === 'ssheasy:error') setLabel(s, s.label, 'error');
        else if (data.type === 'ssheasy:idle') setLabel(s, data.label || s.label, 'idle');
      });

      document.getElementById('addTab').addEventListener('click', function () { newSession(''); });
      document.getElementById('emptyNew').addEventListener('click', function () { newSession(''); });

      // /connect?host=…&port=…&user=… deep links are rewritten to this page,
      // so hand the query straight to the first session document.
      var query = window.location.search.replace(/^\?/, '');
      newSession(query);
    </script>
  </body>
</html>
