<!doctype html>
<html  data-ng-app="FileManagerApp">
  <head>
    <title>File Browser</title>

    <script src="node_modules/angular-filemanager/dep/jquery.min.js"></script>
    <script src="node_modules/angular/angular.min.js"></script>
    <script src="node_modules/angular-translate/dist/angular-translate.min.js"></script>
    <script src="node_modules/ng-file-upload/dist/ng-file-upload.min.js"></script>
    <script src="node_modules/angular-filemanager/dep/bootstrap.min.js"></script>
    <script src="node_modules/angular-filemanager/dep/FileSaver.js"></script>
    
    <link rel="stylesheet" href="node_modules/angular-filemanager/dep/bootstrap.min.css" />
    
    <!-- angular-filemanager -->
    <link rel="stylesheet" href="node_modules/angular-filemanager/angular-filemanager.min.css">
    <script src="node_modules/angular-filemanager/angular-filemanager.min.js"></script>

    <style>
      /* Match the file manager to the host app's palette and type. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      .navbar-inverse {
        background-color: #2563eb;
        border-color: #2563eb;
      }
      .navbar-inverse .navbar-nav > li > a,
      .navbar-inverse .navbar-brand {
        color: #ffffff;
      }
      .navbar-inverse .navbar-nav > li > a:hover,
      .navbar-inverse .navbar-nav > li > a:focus {
        color: #ffffff;
        opacity: .85;
      }
      .breadcrumb {
        padding: 6px 10px;
        border: 1px solid #dde1e7;
        border-radius: 8px;
        background: #fafbfc;
        font-size: 12px;
      }
      .breadcrumb > li + li:before { color: #a8b0bb; }
    </style>

    <script type="text/javascript">
        angular.module('FileManagerApp').config(['fileManagerConfigProvider', function (config) {
            var defaults = config.$get();
            config.set({
                appName: 'angular-filemanager',
                basePath: window.parent.home,
                multiLang: false,
                pickCallback: function(item) {
                var msg = 'Picked %s "%s" for external use'
                    .replace('%s', item.type)
                    .replace('%s', item.fullPath());
                window.alert(msg);
                },

                allowedActions: angular.extend(defaults.allowedActions, {
                pickFiles: false,
                pickFolders: false,
                }),
            });
        }]);
    </script>
  </head>
  <body>
      <div class="ng-cloak">
          <angular-filemanager></angular-filemanager>
      </div>
  </body>
</html>
