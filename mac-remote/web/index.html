<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>knerd.tech · desktop</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #16191e;
    --line: #262b33;
    --text: #e6e9ee;
    --dim: #9aa4b2;
    --accent: #4da3ff;
    --ok: #37d67a;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; -webkit-text-size-adjust: 100%;
  }

  /* viewport: everything the VNC canvas lives in. Scrolling when zoomed past fit. */
  #stage {
    position: fixed; inset: 0 0 34px 0;
    overflow: auto;
    background: var(--bg);
    overscroll-behavior: contain;
    touch-action: none;
  }
  /* noVNC injects its own <canvas> here. */
  #screen {
    transform-origin: 0 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #screen canvas { display: block; }
  #stage.zoomed { display: block; }
  #stage.zoomed #screen { width: auto; height: auto; display: block; }

  /* status pill */
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 30;
    display: flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 8px; border-radius: 999px;
    background: rgba(22, 25, 30, .86); border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    font-variant-numeric: tabular-nums; pointer-events: none;
    max-width: calc(100vw - 24px);
  }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.connecting { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  #dot.connected  { background: var(--ok); }
  #dot.error      { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; } }
  #statusText { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* toolbar */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: 34px; display: flex; align-items: center; gap: 2px;
    padding: 0 6px; background: var(--panel); border-top: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  #bar::-webkit-scrollbar { display: none; }
  button {
    flex: none; height: 24px; padding: 0 8px;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 6px;
    font: inherit; font-size: 12px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  button:hover:not(:disabled) { background: #22262d; border-color: var(--line); }
  button:active:not(:disabled) { background: #2b3038; }
  button:disabled { opacity: .35; cursor: default; }
  button.on { background: rgba(77, 163, 255, .18); border-color: rgba(77, 163, 255, .5); color: #cfe4ff; }
  .sep { flex: none; width: 1px; height: 16px; margin: 0 4px; background: var(--line); }
  .spacer { flex: 1 0 8px; }
  #zoomLabel { min-width: 40px; text-align: center; color: var(--dim); padding: 0 4px; font-variant-numeric: tabular-nums; }

  /* connect / error overlay */
  #overlay {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11, 13, 16, .88); backdrop-filter: blur(4px);
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #card {
    width: 100%; max-width: 340px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px;
  }
  #card h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #card p { margin: 0 0 14px; color: var(--dim); font-size: 12px; }
  #card p.err { color: #ffb3b3; }
  #card label { display: block; margin: 0 0 6px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #card input {
    width: 100%; height: 34px; margin: 0 0 12px; padding: 0 10px;
    background: #0e1116; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font: inherit;
  }
  #card input:focus { outline: none; border-color: var(--accent); }
  #primary {
    width: 100%; height: 36px; border-radius: 8px;
    background: var(--accent); color: #06101d; font-weight: 600; border: none;
  }
  #primary:hover { filter: brightness(1.08); }

  /* toast */
  #toast {
    position: fixed; z-index: 35; left: 50%; bottom: 46px;
    transform: translateX(-50%) translateY(8px);
    max-width: min(560px, calc(100vw - 24px));
    padding: 8px 12px; border-radius: 8px;
    background: #1e232b; border: 1px solid var(--line); color: var(--text);
    font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    white-space: pre-wrap; word-break: break-word;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="stage"><div id="screen"></div></div>

<div id="status"><span id="dot"></span><span id="statusText">starting…</span></div>

<div id="bar">
  <button id="fit" title="Scale the desktop to fit this window">Fit</button>
  <button id="one" title="Show the desktop at its real pixel size">1:1</button>
  <button id="zoomOut" title="Zoom out">−</button>
  <span id="zoomLabel">fit</span>
  <button id="zoomIn" title="Zoom in">+</button>
  <div class="sep"></div>
  <button id="fs" title="Fullscreen">Full</button>
  <div class="sep"></div>
  <button id="kEsc" title="Send Escape">esc</button>
  <button id="kTab" title="Send Tab">tab</button>
  <button id="kCtrl" title="Hold Control (tap to latch)">ctrl</button>
  <button id="kAlt" title="Hold Option (tap to latch)">alt</button>
  <button id="kCmd" title="Hold Command (tap to latch)">⌘</button>
  <div class="sep"></div>
  <button id="paste" title="Send text to the remote clipboard">paste</button>
  <div class="spacer"></div>
  <button id="drop" title="Close the session">disconnect</button>
</div>

<div id="overlay">
  <div id="card">
    <h1 id="cardTitle">Connect to your Mac</h1>
    <p id="cardBody">Enter the VNC password you set in Screen Sharing.</p>
    <label for="pw">VNC password</label>
    <input id="pw" type="password" autocomplete="current-password" maxlength="8" enterkeyhint="go">
    <button id="primary">Connect</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import RFB from './core/rfb.js';

const stage   = document.getElementById('stage');
const screen_ = document.getElementById('screen');
const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const cardBody  = document.getElementById('cardBody');
const pwInput   = document.getElementById('pw');
const primary   = document.getElementById('primary');
const dot       = document.getElementById('dot');
const statusText= document.getElementById('statusText');
const bar       = document.getElementById('bar');
const zoomLabel = document.getElementById('zoomLabel');
const toastEl   = document.getElementById('toast');

const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/websockify';

let rfb = null;
let connected = false;
let fitMode = true;
let zoom = 1;
let password = '';
const latched = { 0xFFE3: false, 0xFFE9: false, 0xFFEB: false };

const STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];

function setStatus(kind, text) {
  dot.className = kind;
  statusText.textContent = text;
}

let toastTimer = null;
function toast(text, ms = 3200) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

function showOverlay(title, body, { password: wantPassword = false, button = 'Connect', error = false } = {}) {
  cardTitle.textContent = title;
  cardBody.textContent = body;
  cardBody.classList.toggle('err', error);
  pwInput.style.display = wantPassword ? '' : 'none';
  document.querySelector('label[for="pw"]').style.display = wantPassword ? '' : 'none';
  primary.textContent = button;
  overlay.classList.remove('hidden');
  if (wantPassword) setTimeout(() => pwInput.focus(), 50);
}
function hideOverlay() { overlay.classList.add('hidden'); }

function updateControls() {
  const on = connected;
  for (const id of ['fit', 'one', 'zoomIn', 'zoomOut', 'fs', 'kEsc', 'kTab', 'kCtrl', 'kAlt', 'kCmd', 'paste', 'drop']) {
    document.getElementById(id).disabled = !on;
  }
  document.getElementById('fit').classList.toggle('on', on && fitMode);
  document.getElementById('one').classList.toggle('on', on && !fitMode && Math.abs(zoom - 1) < 0.001);
  document.getElementById('kCtrl').classList.toggle('on', latched[0xFFE3]);
  document.getElementById('kAlt').classList.toggle('on', latched[0xFFE9]);
  document.getElementById('kCmd').classList.toggle('on', latched[0xFFEB]);
  zoomLabel.textContent = !on ? '—' : fitMode ? 'fit' : Math.round(zoom * 100) + '%';
}

/* ---------- zoom ---------- */

function applyFit() {
  if (!rfb) return;
  fitMode = true;
  rfb.scaleViewport = true;
  stage.classList.remove('zoomed');
  screen_.style.transform = '';
  stage.scrollTop = 0; stage.scrollLeft = 0;
  updateControls();
}

function applyZoom(next) {
  if (!rfb) return;
  fitMode = false;
  zoom = Math.min(3, Math.max(0.25, next));
  rfb.scaleViewport = false;
  stage.classList.add('zoomed');
  screen_.style.transform = 'scale(' + zoom + ')';
  updateControls();
}

function stepZoom(dir) {
  if (fitMode) {
    // coming out of fit: start from the ratio between window and framebuffer
    const fb = rfb && rfb._fbWidth ? rfb._fbWidth : 0;
    const base = fb && stage.clientWidth ? stage.clientWidth / fb : 1;
    applyZoom(base);
    return;
  }
  const i = STEPS.findIndex((s) => s >= zoom - 0.0001);
  const nextIndex = Math.min(STEPS.length - 1, Math.max(0, (i < 0 ? 0 : i) + dir));
  applyZoom(STEPS[nextIndex]);
}

/* ---------- modifiers ---------- */

const MODS = { kCtrl: 0xFFE3, kAlt: 0xFFE9, kCmd: 0xFFEB };
const MOD_CODES = { 0xFFE3: 'ControlLeft', 0xFFE9: 'AltLeft', 0xFFEB: 'MetaLeft' };

function toggleMod(keysym) {
  if (!connected) return;
  const down = !latched[keysym];
  latched[keysym] = down;
  rfb.sendKey(keysym, MOD_CODES[keysym], down);
  updateControls();
}
function releaseMods() {
  for (const keysym of Object.keys(latched)) {
    const k = Number(keysym);
    if (latched[k]) { rfb.sendKey(k, MOD_CODES[k], false); latched[k] = false; }
  }
  updateControls();
}

/* ---------- connection ---------- */

function connect(pw) {
  password = pw || password;
  if (rfb) { try { rfb.disconnect(); } catch (e) {} rfb = null; }
  screen_.innerHTML = '';
  setStatus('connecting', 'connecting…');
  overlay.classList.add('hidden');
  updateControls();

  rfb = new RFB(screen_, WS_URL, { credentials: { password: password } });
  rfb.background = '#0b0d10';
  rfb.viewOnly = false;
  rfb.dragViewport = false;
  rfb.clipViewport = false;
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.focusOnClick = true;

  rfb.addEventListener('connect', () => {
    connected = true;
    fitMode = true; zoom = 1;
    applyFit();
    setStatus('connected', 'connected');
    updateControls();
    toast('Connected — click the screen to give it keyboard focus.');
  });

  rfb.addEventListener('disconnect', (e) => {
    connected = false;
    updateControls();
    setStatus('error', 'disconnected');
    const clean = e.detail && e.detail.clean;
    showOverlay('Disconnected', clean ? 'Session closed.' : 'The connection dropped or was refused.',
      { button: 'Reconnect', error: !clean });
  });

  rfb.addEventListener('credentialsrequired', () => {
    setStatus('error', 'password needed');
    showOverlay('VNC password', 'Screen Sharing wants its VNC password (8 characters at most).',
      { password: true, button: 'Unlock' });
  });

  rfb.addEventListener('securityfailure', (e) => {
    const reason = (e.detail && e.detail.reason) || 'authentication failed';
    setStatus('error', 'auth failed');
    showOverlay('Could not authenticate', reason + '. Try the VNC password again.',
      { password: true, button: 'Retry', error: true });
  });

  rfb.addEventListener('clipboard', (e) => {
    const text = (e.detail && e.detail.text) || '';
    if (text) toast('Remote clipboard: ' + text, 5000);
  });
}

function disconnect() {
  if (rfb) { try { rfb.disconnect(); } catch (e) {} }
  connected = false;
  updateControls();
}

/* ---------- wiring ---------- */

primary.addEventListener('click', () => connect(pwInput.value));

pwInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); connect(pwInput.value); }
});

document.getElementById('fit').addEventListener('click', applyFit);
document.getElementById('one').addEventListener('click', () => applyZoom(1));
document.getElementById('zoomIn').addEventListener('click', () => stepZoom(1));
document.getElementById('zoomOut').addEventListener('click', () => stepZoom(-1));

document.getElementById('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});

document.getElementById('kEsc').addEventListener('click', () => {
  rfb.sendKey(0xFF1B, 'Escape', true);
  rfb.sendKey(0xFF1B, 'Escape', false);
});
document.getElementById('kTab').addEventListener('click', () => {
  rfb.sendKey(0xFF09, 'Tab', true);
  rfb.sendKey(0xFF09, 'Tab', false);
});
for (const [id, keysym] of Object.entries(MODS)) {
  document.getElementById(id).addEventListener('click', () => toggleMod(keysym));
}

document.getElementById('paste').addEventListener('click', () => {
  const text = window.prompt('Send this text to the remote clipboard:');
  if (text) { rfb.clipboardPasteFrom(text); toast('Sent to the remote clipboard.'); }
});

document.getElementById('drop').addEventListener('click', disconnect);

// Ctrl/Cmd-V pasted into the page goes to the remote clipboard too.
document.addEventListener('paste', (e) => {
  if (!connected) return;
  const text = e.clipboardData && e.clipboardData.getData('text');
  if (text) { e.preventDefault(); rfb.clipboardPasteFrom(text); toast('Sent to the remote clipboard.'); }
});

// wheel: plain scroll must reach the remote, but Ctrl/⌘ + wheel zooms the view instead
stage.addEventListener('wheel', (e) => {
  if (!connected || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  stepZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

// keep the toolbar from scrolling away on tiny windows
window.addEventListener('resize', () => {
  if (rfb && fitMode) applyFit();
});

// First visit: ask for the password once. Browsers remember the Basic password themselves.
showOverlay(
  'Connect to your Mac',
  'Enter the VNC password from Screen Sharing. The browser has already asked for your tunnel password.',
  { password: true, button: 'Connect' }
);
setStatus('', 'idle');
updateControls();
</script>
</body>
</html>
