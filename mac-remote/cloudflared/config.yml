# Locally-managed Cloudflare Tunnel for macOS Screen Sharing.
#
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create mac-remote      # prints the UUID below
#   3. cloudflared tunnel route dns mac-remote vnc.knerd.tech
#   4. run: cloudflared tunnel --config ./config.yml run mac-remote
#
# Only needed for the locally-managed variant. If you created the tunnel in the dashboard
# and installed the connector with `sudo cloudflared service install <token>` (the
# recommended path, see README step 2), you do not need this file at all.
#
# Replace TUNNEL_UUID before use. The hostname and username are already set.

tunnel: TUNNEL_UUID
credentials-file: /Users/knerd/.cloudflared/TUNNEL_UUID.json

# Screen Sharing on macOS listens on 5900 for both its own client and third-party
# VNC viewers. Cloudflare Access renders the browser VNC client in front of this.
ingress:
  - hostname: vnc.knerd.tech
    service: tcp://127.0.0.1:5900
  - service: http_status:404
